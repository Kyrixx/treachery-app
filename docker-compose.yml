services:
  app:
    image: ghcr.io/tchapuis/treachery-app:latest
    build: .
    restart: unless-stopped
    volumes:
      - app_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. treachery.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  app_data:
  caddy_data:
